<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1280" width="2048" height="1280" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="1.5" />
    </pattern>
    <style>
      .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .black { font-weight: 900; }
      .bold { font-weight: 800; }
      .semibold { font-weight: 600; }
    </style>
  </defs>

  <!-- Browser Chrome Topbar -->
  <rect width="2048" height="90" fill="#0f111a" />
  <!-- Window dots -->
  <circle cx="50" cy="45" r="10" fill="#ff5f56" />
  <circle cx="85" cy="45" r="10" fill="#ffbd2e" />
  <circle cx="120" cy="45" r="10" fill="#27c93f" />

  <!-- URL Bar -->
  <rect x="180" y="20" width="1050" height="50" rx="8" fill="#1b1e2c" stroke="#2d3348" stroke-width="1.5" />
  <text x="210" y="52" class="font-mono semibold" font-size="20" fill="#10b981">🔒 https://southdvstudio.eu</text>

  <!-- Top Right Badges -->
  <rect x="1620" y="24" width="370" height="42" rx="6" fill="#1c9cf0" opacity="0.15" stroke="#1c9cf0" stroke-width="1.5" />
  <text x="1805" y="51" class="font-mono bold" font-size="16" fill="#1c9cf0" text-anchor="middle">✦ NEXT.JS 15 • LIVE IN PRODUZIONE</text>

  <!-- Webpage Body -->
  <g transform="translate(0, 90)">
    <!-- White background with subtle grid -->
    <rect width="2048" height="1190" fill="#ffffff" />
    <rect width="2048" height="1190" fill="url(#grid)" opacity="0.8" />
    <circle cx="1850" cy="220" r="420" fill="#1c9cf0" opacity="0.07" />

    <!-- Website Header -->
    <rect x="0" y="0" width="2048" height="110" fill="#ffffff" opacity="0.95" />
    <line x1="0" y1="110" x2="2048" y2="110" stroke="#000000" stroke-width="4" />

    <!-- Logo Monogram -->
    <g transform="translate(100, 22)">
      <rect x="6" y="6" width="66" height="66" rx="14" fill="#000000" />
      <rect x="0" y="0" width="66" height="66" rx="14" fill="#1c9cf0" stroke="#000000" stroke-width="3.5" />
      <path d="M 45 22 L 28 22 C 23 22 20 25 20 30 C 20 35 23 38 28 38 L 40 38 C 45 38 48 41 48 46 C 48 51 45 54 40 54 L 22 54" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="square" />
    </g>

    <!-- Logo text -->
    <text x="185" y="68" class="font-mono black" font-size="34" fill="#000000" letter-spacing="-1">southdv<tspan fill="#1c9cf0">.studio</tspan></text>

    <!-- Salerno Badge -->
    <g transform="translate(460, 36)">
      <rect x="3" y="3" width="140" height="38" fill="#000000" />
      <rect x="0" y="0" width="140" height="38" fill="#1c9cf0" stroke="#000000" stroke-width="2.5" />
      <text x="70" y="25" class="font-mono bold" font-size="15" fill="#ffffff" text-anchor="middle" letter-spacing="1">SALERNO · IT</text>
    </g>

    <!-- Nav Bar -->
    <g transform="translate(1320, 28)">
      <rect x="4" y="4" width="620" height="54" rx="27" fill="#000000" />
      <rect x="0" y="0" width="620" height="54" rx="27" fill="#ffffff" stroke="#000000" stroke-width="3" />
      <rect x="8" y="7" width="120" height="40" rx="20" fill="#1c9cf0" stroke="#000000" stroke-width="2" />
      <text x="68" y="33" class="font-mono bold" font-size="16" fill="#ffffff" text-anchor="middle">HOME</text>
      <text x="210" y="33" class="font-mono bold" font-size="16" fill="#475569">TEST 0€</text>
      <text x="365" y="33" class="font-mono bold" font-size="16" fill="#475569">RICHIEDI BOZZA</text>
      <text x="535" y="33" class="font-mono bold" font-size="16" fill="#475569">CONTATTI</text>
    </g>

    <!-- Hero Content -->
    <!-- Pill Tag -->
    <g transform="translate(100, 160)">
      <rect x="5" y="5" width="700" height="50" fill="#000000" />
      <rect x="0" y="0" width="700" height="50" fill="#ffffff" stroke="#000000" stroke-width="3" />
      <text x="30" y="33" class="font-mono bold" font-size="18" fill="#000000" letter-spacing="0.5">
        <tspan fill="#1c9cf0">✦</tspan> SVILUPPO WEB PROFESSIONALE · <tspan fill="#1c9cf0">CODICE 100% TUO</tspan>
      </text>
    </g>

    <!-- H1 Headline -->
    <text x="100" y="285" class="font-sans black" font-size="78" fill="#000000" letter-spacing="-2.5">
      Il tuo nuovo sito web.
    </text>
    <text x="100" y="375" class="font-sans black" font-size="78" fill="#000000" letter-spacing="-2.5">
      Tuo al 100%. Da <tspan fill="#1c9cf0">599,99€</tspan>.
    </text>
    <text x="100" y="455" class="font-sans black" font-size="52" fill="#000000" letter-spacing="-1.5">
      Zero canoni obbligatori.
    </text>

    <!-- Subtitle paragraph -->
    <text x="100" y="525" class="font-sans semibold" font-size="25" fill="#475569">
      Dimentica i preventivi gonfiati da agenzia e le brutte sorprese. Creiamo il sito moderno
    </text>
    <text x="100" y="562" class="font-sans semibold" font-size="25" fill="#475569">
      per la tua attività in Next.js: codice tuo chiavi in mano. Bozza reale in 7 giorni senza anticipo.
    </text>

    <!-- Hero CTAs -->
    <g transform="translate(100, 620)">
      <!-- Primary Blue Button -->
      <g>
        <rect x="7" y="7" width="370" height="74" fill="#000000" />
        <rect x="0" y="0" width="370" height="74" fill="#1c9cf0" stroke="#000000" stroke-width="3.5" />
        <text x="185" y="47" class="font-mono bold" font-size="22" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">Richiedi Bozza Gratuita →</text>
      </g>

      <!-- Secondary White Button -->
      <g transform="translate(420, 0)">
        <rect x="7" y="7" width="360" height="74" fill="#000000" />
        <rect x="0" y="0" width="360" height="74" fill="#ffffff" stroke="#000000" stroke-width="3.5" />
        <text x="180" y="47" class="font-mono bold" font-size="22" fill="#000000" text-anchor="middle">Guarda i Siti Realizzati</text>
      </g>
    </g>

    <!-- Ticker Bar -->
    <g transform="translate(100, 745)">
      <rect x="0" y="0" width="1848" height="54" fill="#000000" />
      <text x="40" y="35" class="font-mono bold" font-size="18" fill="#ffffff" letter-spacing="2">
        NEXT.JS 15 ■ ACQUISTO UNA TANTUM ■ ZERO CANONI OBBLIGATORI ■ CODICE PROPRIETARIO 100% ■ CONSEGNA IN 7 GIORNI
      </text>
    </g>

    <!-- 4 Neo-Brutalist Value Cards -->
    <g transform="translate(100, 840)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect x="6" y="6" width="430" height="150" fill="#000000" />
        <rect x="0" y="0" width="430" height="150" fill="#ffffff" stroke="#000000" stroke-width="3" />
        <text x="35" y="65" class="font-sans black" font-size="52" fill="#1c9cf0">0€</text>
        <text x="35" y="105" class="font-mono bold" font-size="20" fill="#000000">Anticipo Iniziale</text>
        <text x="35" y="130" class="font-sans semibold" font-size="16" fill="#64748b">Paghi solo a bozza approvata</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(470, 0)">
        <rect x="6" y="6" width="430" height="150" fill="#000000" />
        <rect x="0" y="0" width="430" height="150" fill="#ffffff" stroke="#000000" stroke-width="3" />
        <text x="35" y="65" class="font-sans black" font-size="52" fill="#000000">7 Giorni</text>
        <text x="35" y="105" class="font-mono bold" font-size="20" fill="#000000">Consegna Media</text>
        <text x="35" y="130" class="font-sans semibold" font-size="16" fill="#64748b">Dalla bozza al go-live online</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(940, 0)">
        <rect x="6" y="6" width="430" height="150" fill="#000000" />
        <rect x="0" y="0" width="430" height="150" fill="#ffffff" stroke="#000000" stroke-width="3" />
        <text x="35" y="65" class="font-sans black" font-size="52" fill="#1c9cf0">100%</text>
        <text x="35" y="105" class="font-mono bold" font-size="20" fill="#000000">Proprietà del Codice</text>
        <text x="35" y="130" class="font-sans semibold" font-size="16" fill="#64748b">Nessun vincolo né lock-in</text>
      </g>

      <!-- Card 4 -->
      <g transform="translate(1410, 0)">
        <rect x="6" y="6" width="438" height="150" fill="#000000" />
        <rect x="0" y="0" width="438" height="150" fill="#ffffff" stroke="#000000" stroke-width="3" />
        <text x="35" y="65" class="font-sans black" font-size="52" fill="#000000">&lt; 0.5s</text>
        <text x="35" y="105" class="font-mono bold" font-size="20" fill="#000000">Velocità Mobile</text>
        <text x="35" y="130" class="font-sans semibold" font-size="16" fill="#64748b">Massimo punteggio Lighthouse</text>
      </g>
    </g>
  </g>
</svg>